<style>
/* Layout: lab-notebook index — sticky year rail on top, prize "specimen cards" in a 2-col grid */
:root{
  --bg:#f3f5f2; --paper:#ffffff; --ink:#1b2620; --muted:#5d6b63; --line:#d5ddd7;
  --accent:#2f5d46; --stamp:#d9a520; --stamp-ink:#1b2620; --chip:#e6ece7;
  --display:"Black Han Sans","IBM Plex Sans KR",system-ui,sans-serif;
  --body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121815; --paper:#1a221e; --ink:#e4ebe6; --muted:#9aa9a0; --line:#2e3a33;
  --accent:#8cc6a6; --stamp:#e6b93a; --stamp-ink:#121815; --chip:#24302a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121815; --paper:#1a221e; --ink:#e4ebe6; --muted:#9aa9a0; --line:#2e3a33;
  --accent:#8cc6a6; --stamp:#e6b93a; --stamp-ink:#121815; --chip:#24302a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{padding-block:60px 76px;position:relative}
 .toprow{display:flex;justify-content:space-between;align-items:flex-start;gap:12px 24px;flex-wrap:wrap}
.search{position:relative;display:flex;align-items:center;width:320px;max-width:100%;color:var(--muted)}
.search svg{position:absolute;left:12px;pointer-events:none}
.search input{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:8px 12px 8px 38px;width:100%}
.search input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:640px){.toprow{flex-direction:column-reverse}.search{width:100%}}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--display);font-weight:400;font-size:clamp(34px,6vw,56px);line-height:1.1;margin:6px 0 10px;text-wrap:balance}
h1 .ig{display:inline-block;background:var(--stamp);color:var(--stamp-ink);padding:0 .18em;transform:rotate(-3deg);margin-right:.08em}
.lede{max-width:62ch;color:var(--muted);margin:0}
nav.years{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.yearbar{display:flex;gap:8px;overflow-x:auto;padding-block:12px;scrollbar-width:thin}
.yearbar button{font:500 14px/1 var(--mono);color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:999px;padding:9px 16px;cursor:pointer;white-space:nowrap;font-variant-numeric:tabular-nums}
.yearbar button:hover{border-color:var(--accent)}
.yearbar button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.yearbar button:disabled{opacity:.4;cursor:not-allowed;border-style:dashed}
.yearbar button:focus-visible,.card a:focus-visible,.tools input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tools{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding-block:18px 4px}
.tools input{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:9px 12px;width:min(320px,100%)}
.count{font-family:var(--mono);font-size:13px;color:var(--muted)}
section.year{padding-block:20px 36px}
.yhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px;border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:18px}
.yhead h2{font-family:var(--display);font-weight:400;font-size:44px;line-height:1;margin:0;font-variant-numeric:tabular-nums}
.yhead .meta{color:var(--muted);font-size:14px}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:760px}
th{text-align:left;font-weight:700;font-size:15px;padding:14px 28px;border-bottom:2px solid var(--line)}
td{padding:16px 28px;border-bottom:1px solid var(--line);vertical-align:top}
td.c1{white-space:nowrap;width:1%}
th{white-space:nowrap}
td.c3{white-space:nowrap;width:1%}
td.c4{white-space:nowrap;width:1%}
td .none{font-size:13px;color:var(--muted);opacity:.6}
td.c4 .pdfs{margin-top:0;flex-direction:column;align-items:stretch;width:max-content}
td a.pbtn{display:inline-flex;align-items:center;gap:5px}
td a.pbtn svg{flex:none}
td a{color:var(--accent);font-weight:500;text-decoration:none}
td a:hover{text-decoration:underline}
td a.golink{display:inline-flex;align-items:center;gap:4px;transition:color .15s}
td a.golink:hover{color:color-mix(in srgb,var(--accent) 65%,var(--bg));text-decoration:none}
td a.golink:active{color:var(--ink)}
@media (prefers-reduced-motion:reduce){td a.golink{transition:none}}
.pdfs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:8px}
.plab{font-size:12px;color:var(--muted);width:2.4em}
td a.pbtn{font-size:12.5px;font-weight:500;padding:4px 10px;border:1px solid var(--accent);border-radius:6px;white-space:nowrap}
td a.pbtn.ko{background:var(--accent);color:var(--bg)}
td a.pbtn{transition:background-color .15s,border-color .15s,color .15s}
td a.pbtn:hover{text-decoration:none;background:color-mix(in srgb,var(--accent) 12%,transparent)}
td a.pbtn.ko:hover{background:color-mix(in srgb,var(--accent) 78%,var(--bg));border-color:color-mix(in srgb,var(--accent) 78%,var(--bg))}
@media (prefers-reduced-motion:reduce){td a.pbtn{transition:none}}
td a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
td .sub{display:block;font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.5}
td .more{display:block;font-size:13px;margin-top:4px}
td a.more{color:color-mix(in srgb,var(--accent) 55%,var(--bg));font-weight:400;transition:color .15s}
td a.more:hover{color:var(--accent);text-decoration:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,440px),1fr));gap:16px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:18px 20px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card .row1{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.cat{display:flex;align-items:baseline;gap:8px}
.cat b{font-family:var(--display);font-weight:400;font-size:22px;line-height:1.2}
.cat span{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.flags{display:flex;flex-wrap:wrap;gap:4px}
.flags i{font-style:normal;font-size:12px;background:var(--chip);color:var(--muted);padding:2px 8px;border-radius:4px}
.topic{font-size:16px;font-weight:500;margin:0;text-wrap:pretty}
.en{font-size:13px;color:var(--muted);margin:0;font-style:italic}
.who{font-size:13px;color:var(--muted);margin:0}
.who strong{color:var(--ink);font-weight:500}
.refs{border-top:1px dashed var(--line);padding-top:10px;margin-top:auto;display:flex;flex-direction:column;gap:10px}
.refs .lab{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--muted)}
.refs a{display:block;color:var(--accent);font-weight:500;text-decoration:none;line-height:1.4}
.refs a:hover{text-decoration:underline}
.refs a::after{content:" ↗";font-family:var(--mono)}
.refs small{display:block;font-family:var(--mono);font-size:11.5px;color:var(--muted);line-height:1.5;overflow-wrap:anywhere;margin-top:2px}
.empty{padding:40px 0;color:var(--muted)}
footer{padding-block:24px 48px;color:var(--muted);font-size:13px;border-top:1px solid var(--line)}
footer a{color:var(--accent)}
</style>

  const term=q.value.trim().toLowerCase();
  const years = DATA.filter(d=>sel==='all'||String(d.year)===sel).sort((a,b)=>b.year-a.year);
  let n=0;
  years.forEach(d=>d.prizes.forEach(p=>p.year=d.year));
  const html = years.map(d=>{
    const ps=d.prizes.filter(p=>!term||[p.cat,p.catKo,p.short,p.topicKo,p.topicEn,p.winners,...p.refs.map(r=>r.title)].join(' ').toLowerCase().includes(term));
    n+=ps.length; if(!ps.length) return '';
    return `<section class="year" id="s${d.year}"><div class="yhead"><h2>${d.year}</h2>
      <span class="meta">${esc(d.edition)} 시상식 · ${esc(d.date)} · ${esc(d.place)}${d.note?' · '+esc(d.note):''}</span></div>
      <div class="tbl-wrap"><table><thead><tr><th scope="col">수상 분야</th><th scope="col">연구 주제</th><th scope="col">논문 URL</th><th scope="col">원문 PDF</th><th scope="col">한국어 번역 PDF</th></tr></thead><tbody>${ps.map(row).join('')}</tbody></table></div></section>`;
  }).join('');
  view.innerHTML = html || `<p class="empty">“${esc(q.value)}”에 맞는 수상 연구가 없습니다. 다른 낱말로 검색해 보세요.</p>`;
  countEl.textContent = `${sel==='all'?'전체 '+years.length+'개 연도':sel+'년'} · ${n}개 부문`;
}
function route(){
  const h=location.hash.slice(1);
  sel = (h.startsWith('y') && ready.has(+h.slice(1))) ? h.slice(1) : 'all';
  buildBar(); render();
}
q.addEventListener('input',render);
window.addEventListener('hashchange',route);
route();
</script>

</html>
